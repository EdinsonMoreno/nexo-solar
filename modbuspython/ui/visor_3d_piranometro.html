<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Visor 3D Piranómetro</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e0e0e0; }
    #container { width: 100vw; height: 100vh; }
    #error {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #b00; background: #fff3f3;
      border: 2px solid #b00; padding: 18px 32px;
      border-radius: 12px; font-size: 1.2em;
      display: none; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="error">Error de carga</div>

  <script type="importmap">
  {
    "imports": {
      "three": "../assets/threejs/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from '../assets/threejs/three.module.js';
    import { OrbitControls } from '../assets/threejs/OrbitControls.js';
    import { GLTFLoader } from '../assets/threejs/GLTFLoader.js';

    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e0e0e0');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 7.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 4;
    controls.maxDistance = 20;
    controls.target.set(0, 1.2, 0);
    controls.update();

    const loader = new GLTFLoader();
    loader.load('../assets/tripod_assembly.glb', gltf => {
      const model = gltf.scene;
      model.scale.set(2.2, 2.2, 2.2);
      model.position.set(0, 0, 0);
      scene.add(model);
    }, undefined, error => {
      document.getElementById('error').style.display = 'block';
      console.error('Error al cargar modelo:', error);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
