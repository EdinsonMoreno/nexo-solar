[pytest]
# Pytest configuration for SolarSense SCADA

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    property: Property-based tests using Hypothesis
    validation: Validation service tests
    config: Configuration management tests
    config_validation: Configuration validation tests
    config_format: Configuration format tests
    retry: Retry strategy tests
    error_resilience: Error resilience tests
    resource_cleanup: Resource cleanup tests
    database: Database operation tests
    migration: Database migration tests
    integration: Integration tests
    unit: Unit tests
    slow: Slow running tests

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=modbuspython
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    -n auto
    --dist loadgroup

# Hypothesis settings
# Note: Individual tests can override these with @settings decorator
hypothesis_profile = default

[hypothesis]
# Default profile for property-based tests
max_examples = 50
deadline = None
verbosity = normal
