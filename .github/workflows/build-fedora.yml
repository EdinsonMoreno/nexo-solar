name: Build Fedora package

on:
  push:
    branches: [ production/fedora ]
    tags: [ 'fedora-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fedora:
    name: Fedora RPM package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:42 \
            bash -lc 'dnf install -y python3 python3-pip python3-devel gcc rpm-build findutils tar gzip && chmod +x scripts/build_fedora_rpm.sh && scripts/build_fedora_rpm.sh 1.0.0'

      - name: Upload Fedora package artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoSolar-Fedora-x86_64
          path: |
            dist/installers/fedora/*.rpm
            dist/installers/fedora/*.tar.gz
            dist/installers/fedora/SHA256SUMS.txt

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Nexo Solar ${tag}" --notes "Paquete Fedora de Nexo Solar."
          gh release upload "$tag" dist/installers/fedora/* --clobber
