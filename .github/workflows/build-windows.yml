name: Build Windows installer

on:
  push:
    branches: [ production/windows ]
    tags: [ 'windows-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows executable and installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1 -Version "1.0.0"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoSolar-Windows-x64
          path: |
            dist/installers/windows/NexoSolar-Setup-Windows-x64.exe
            dist/installers/windows/SHA256SUMS.txt

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Nexo Solar ${tag}" --notes "Instalador Windows de Nexo Solar."
          gh release upload "$tag" dist/installers/windows/NexoSolar-Setup-Windows-x64.exe dist/installers/windows/SHA256SUMS.txt --clobber
