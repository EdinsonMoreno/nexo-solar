[mypy]
# MyPy configuration for SolarSense SCADA
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
warn_unreachable = False
strict_equality = False
ignore_missing_imports = True
exclude = (modbuspython/tests/|modbuspython/examples/)

# Per-module options
[mypy-modbuspython.tests.*]
ignore_errors = True

[mypy-modbuspython.examples.*]
ignore_errors = True

[mypy-modbuspython.backend.modbus_client]
ignore_errors = True

[mypy-modbuspython.ui.map_widget]
ignore_errors = True

[mypy-modbuspython.ui.location_tab_fixed]
ignore_errors = True

[mypy-modbuspython.ui.diagnostic_tab]
ignore_errors = True

[mypy-modbuspython.ui.monitor_tab]
ignore_errors = True

[mypy-modbuspython.ui.circular_gauge]
ignore_errors = True

[mypy-modbuspython.main_app]
ignore_errors = True

[mypy-modbuspython.config.config_manager]
ignore_errors = True

[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-pymodbus.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
